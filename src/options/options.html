<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabTune 快捷键</title><link rel="stylesheet" href="options.css"></head>
  <body><main><h1>TabTune 全局快捷键</h1><p class="intro">在 Chrome 快捷键管理页为每个操作录入快捷键，并选择“全局”范围。</p><section class="access"><h2>网页访问权限</h2><p id="permission-status" class="hint">正在检查网页访问权限…</p><button id="permission">允许控制网页媒体</button></section><div id="commands" aria-live="polite">正在读取快捷键…</div><button id="open">打开 Chrome 全局快捷键设置</button><p class="hint">Chrome 负责保存和分发系统级全局快捷键，TabTune 负责控制媒体标签页。</p></main><script type="module" src="options.js"></script></body>
</html>
