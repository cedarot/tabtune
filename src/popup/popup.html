<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabTune</title><link rel="stylesheet" href="popup.css"></head>
  <body><main><header><h1>TabTune</h1><button id="refresh" title="刷新">↻</button></header><p id="status" role="status">正在查找媒体…</p><section id="target"></section><section><h2>发声标签页</h2><div id="candidates"></div></section><section class="controls"><button data-action="previous-track">上一项</button><button data-action="toggle-playback">播放／暂停</button><button data-action="next-track">下一项</button><button data-action="volume-down">音量−</button><button data-action="volume-up">音量＋</button><button data-action="seek-backward">快退 10 秒</button><button data-action="seek-forward">快进 10 秒</button></section><button id="permission" class="secondary">允许控制网页媒体</button><p class="hint">全局快捷键请在 chrome://extensions/shortcuts 中设置。</p></main><script type="module" src="popup.js"></script></body>
</html>
